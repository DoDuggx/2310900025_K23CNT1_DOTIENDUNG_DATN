name: NovaMart Backend Build

on:
  push:
    branches: [main]
    paths:
      - "Backend/NovaMart_Backend/**"
      - ".github/workflows/backend-build.yml"
  pull_request:
    paths:
      - "Backend/NovaMart_Backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -f Backend/NovaMart_Backend/pom.xml test
